name: Daily GST & Income Tax notification fetch

on:
  schedule:
    # 03:00 UTC = 08:30 IST, every day. Edit the cron to change the time.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetcher
        run: python fetch_notifications.py

      - name: Commit updated data
        run: |
          git config user.name "notification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notifications.json new_today.json docs/index.html
          git diff --staged --quiet || git commit -m "Daily notification update $(date -u +%Y-%m-%d)"
          git push

